name: Push to Update Server

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  UPDATE_SERVER: ${{ secrets.UPDSU_UPDATE_SERVER }}
  SOFTWARE_ID: EhClipboard
  EXE_ASSET: EhClipboardSetup.exe
  OS_KEY: windows_x64

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
          fi
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "raw=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Fetch release details
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW: ${{ steps.version.outputs.raw }}
        run: |
          gh release view "$RAW" --repo "${{ github.repository }}" --json tagName,body,assets -q '
            {
              tag: .tagName,
              body: .body,
              exe: [.assets[] | select(.name == env.EXE_ASSET)] | first // null
            }
          ' > release.json
          cat release.json
          echo "url=$(gh release view "$RAW" --repo "${{ github.repository }}" --json assets -q "[.assets[] | select(.name == \"$EXE_ASSET\")][0].url")" >> "$GITHUB_OUTPUT"

      - name: Download exe asset
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW: ${{ steps.version.outputs.raw }}
        run: |
          gh release download "$RAW" --repo "${{ github.repository }}" --pattern "$EXE_ASSET" --clobber
          echo "sha256=$(sha256sum "$EXE_ASSET" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build payload
        id: payload
        env:
          REPO: ${{ github.repository }}
          RAW: ${{ steps.version.outputs.raw }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          python - <<'EOF'
          import json, os
          rel = json.load(open('release.json'))
          exe = rel.get('exe')
          if not exe:
              print('missing', os.environ['EXE_ASSET'], 'asset, aborting')
              raise SystemExit(1)
          url = f"https://github.com/{os.environ['REPO']}/releases/download/{os.environ['RAW']}/{os.environ['EXE_ASSET']}"
          payload = {
              "id": os.environ['SOFTWARE_ID'],
              "version": os.environ['TAG'],
              "release_notes": rel.get('body').strip() if rel.get('body') else f"Release {os.environ['TAG']}",
              "files": {
                  os.environ['OS_KEY']: {
                      "url": url,
                      "hash": os.environ['SHA256'],
                  }
              },
          }
          open('payload.json', 'w').write(json.dumps(payload))
          print(json.dumps(payload, indent=2))
          EOF

      - name: Push to update server
        run: |
          curl -fsS -X POST "$UPDATE_SERVER" \
            -H "Authorization: Bearer ${{ secrets.UPDSU_PUSH_PASSWORD }}" \
            -H "Content-Type: application/json" \
            --data-binary @payload.json

  winget:
    name: Push to winget-pkgs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve tag
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
          fi
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "raw=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install komac
        run: |
          curl -fsSL https://github.com/russellbanks/Komac/releases/download/v2.13.0/komac-2.13.0-x86_64-unknown-linux-gnu.tar.gz -o komac.tar.gz
          tar xzf komac.tar.gz
          sudo mv komac /usr/local/bin/
          komac --version

      - name: Sync winget-pkgs fork
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_PUSH_TOKEN }}
          FORK_OWNER: nothuheh
        run: |
          git clone --depth 1 --branch master https://github.com/microsoft/winget-pkgs.git winget-pkgs
          cd winget-pkgs
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${FORK_OWNER}/winget-pkgs.git" HEAD:master

      - name: Update Eh.clipboard in winget-pkgs
        id: komac
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_PUSH_TOKEN }}
        run: |
          URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.raw }}/EhClipboardSetup.exe"
          set +e
          komac update Eh.clipboard --urls "$URL" --version "${{ steps.version.outputs.tag }}" --submit > komac.log 2>&1
          KOMAC_RC=$?
          set -e
          cat komac.log
          PR=$(grep -oE 'https://github.com/microsoft/winget-pkgs/pull/[0-9]+' komac.log | tail -1 | grep -oE '[0-9]+$' || true)
          if [ -z "$PR" ]; then
            echo "could not find PR url in komac output" >&2
            exit $KOMAC_RC
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Add credit to winget PR
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_PUSH_TOKEN }}
        run: |
          PR="${{ steps.komac.outputs.pr }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="${{ github.event.release.html_url || format('https://github.com/{0}/releases/tag/{1}', github.repository, steps.version.outputs.raw) }}"
          gh api "repos/microsoft/winget-pkgs/pulls/$PR" --jq .body > pr_body.md
          printf '\n\nThis has been automated with this [workflow](%s) via the [new release](%s).' \
            "$WORKFLOW_URL" "$RELEASE_URL" >> pr_body.md
          jq -sR '{body: .}' pr_body.md > pr_body.json
          gh api "repos/microsoft/winget-pkgs/pulls/$PR" -X PATCH --input pr_body.json